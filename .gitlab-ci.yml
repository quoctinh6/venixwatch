stages:
  - deploy

deploy_production:
  stage: deploy
  image: alpine:latest
  only:
    - giao-dien-moi
  before_script:
    - apk add --no-cache git git-ftp
  script:
    # Set safe directory for git to prevent ownership issues in CI container
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Try pushing changes first; if it fails (not initialized), run init
    - |
      echo "Starting deployment to ftp://$FTP_HOST/httpdocs..."
      git ftp push --user "$FTP_USER" --passwd "$FTP_PASSWORD" "ftp://$FTP_HOST/httpdocs" || \
      git ftp init --user "$FTP_USER" --passwd "$FTP_PASSWORD" "ftp://$FTP_HOST/httpdocs"
